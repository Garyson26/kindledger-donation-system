# =============================================================================
# Shared location blocks, included by both the HTTP and HTTPS server blocks.
# =============================================================================
# Ordering matters. Nginx picks the longest matching prefix, but a regex
# location (~) beats every prefix location except ^~. The payment callback
# regex below therefore wins over the /api/ prefix, which is what we want.
# =============================================================================

# -----------------------------------------------------------------------------
# Uploaded branding assets
# -----------------------------------------------------------------------------
# Served straight off the uploads volume, never through Node.
#
# The X-Content-Type-Options header matters more here than anywhere else in the
# stack: these are admin-uploaded files. Phase 5 restricts uploads to png, jpeg
# and webp and re-encodes them server-side, but defence in depth is cheap.
# Content-Disposition and a locked-down CSP mean that even if a hostile file
# reaches the volume, the browser will not execute it in our origin.
# -----------------------------------------------------------------------------
location ^~ /uploads/ {
    alias /var/www/uploads/;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'none'; script-src 'none'; sandbox" always;
    add_header Cache-Control "public, max-age=86400" always;

    # Never execute anything here, whatever its extension.
    location ~* \.(php|phtml|pl|py|jsp|asp|aspx|sh|cgi|html?|svg|xml)$ {
        return 404;
    }

    try_files $uri =404;
    autoindex off;
}

# -----------------------------------------------------------------------------
# PayU callbacks - deliberately NOT tightly rate limited
# -----------------------------------------------------------------------------
# These are browser-delivered form POSTs (success, failure, cancel) and one
# server-to-server call (webhook). Dropping one loses the payment state for a
# donation that the donor has already paid for, so a 429 here is worse than
# the load it would prevent.
#
# They are safe to leave open because every one of them is authenticated by
# the PayU SHA-512 response hash before it mutates anything. The generous
# burst absorbs a legitimate spike; the zone still caps a sustained flood.
#
# Note for Phase 3: /api/payment/initiate is NOT matched here. It writes a
# database row on every call with no authentication (SEC-11) and is throttled
# by the /api/ block below.
# -----------------------------------------------------------------------------
location ~ ^/api/payment/(success|failure|cancel|webhook)$ {
    limit_req zone=api burst=40 nodelay;

    proxy_pass http://api_upstream;
    include /etc/nginx/conf.d/kindledger-proxy.conf;
}

# -----------------------------------------------------------------------------
# Authentication endpoints - tight limit
# -----------------------------------------------------------------------------
# The backstop for SEC-02 (reset-code brute force) and password spraying.
# burst=5 nodelay lets a real user mistype an OTP a few times without waiting;
# beyond that they are queued out.
# -----------------------------------------------------------------------------
location ^~ /api/auth/ {
    limit_req zone=auth burst=5 nodelay;

    proxy_pass http://api_upstream;
    include /etc/nginx/conf.d/kindledger-proxy.conf;
}

# -----------------------------------------------------------------------------
# Everything else under /api/
# -----------------------------------------------------------------------------
location ^~ /api/ {
    limit_req zone=api burst=20 nodelay;

    proxy_pass http://api_upstream;
    include /etc/nginx/conf.d/kindledger-proxy.conf;
}

# -----------------------------------------------------------------------------
# Anything else
# -----------------------------------------------------------------------------
# The frontend stays on Vercel (SPEC-1A section 3.1), so this host serves only
# the API and the uploads. Returning 404 rather than proxying keeps unmatched
# traffic off the Node process.
# -----------------------------------------------------------------------------
location / {
    return 404;
}
