# =============================================================================
# Shared proxy headers and timeouts, included by every proxying location.
# =============================================================================

proxy_http_version 1.1;

# X-Forwarded-For is the header the application's `trust proxy` setting reads.
# $proxy_add_x_forwarded_for appends the real client IP (already corrected by
# real_ip_header) to any inbound value. With exactly one trusted hop the
# application takes the last entry, which a client cannot forge.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header Host              $host;

# Required for keepalive to the upstream.
proxy_set_header Connection        "";

# Do not let an upstream Server header leak the Express version.
proxy_hide_header X-Powered-By;

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# The API returns JSON and 302 redirects; nothing needs buffering off.
proxy_buffering on;
proxy_redirect  off;
