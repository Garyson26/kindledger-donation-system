# =============================================================================
# Shared proxy headers and timeouts, included by every proxying location.
# =============================================================================

proxy_http_version 1.1;

# OVERWRITE, do not append (SPEC-2 section 7.3).
#
# $proxy_add_x_forwarded_for APPENDS to whatever the client sent, so a request
# arriving with `X-Forwarded-For: 1.2.3.4` reaches the app as "1.2.3.4, <real>".
# Express with `trust proxy: 1` then takes the last entry, which is correct -
# but the value is only correct by arithmetic, and it stops being correct the
# moment the hop count and the header no longer agree.
#
# $remote_addr replaces the header outright with the address that opened the
# connection. A client-supplied X-Forwarded-For is discarded rather than
# out-counted, so `trust proxy: 1` is right for a structural reason instead of a
# numerical one.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header Host              $host;

# Required for keepalive to the upstream.
proxy_set_header Connection        "";

# Do not let an upstream Server header leak the Express version.
proxy_hide_header X-Powered-By;

proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# The API returns JSON and 302 redirects; nothing needs buffering off.
proxy_buffering on;
proxy_redirect  off;
