# =============================================================================
# KindLedger - Nginx reverse proxy (SPEC-1A section 3.3)
# =============================================================================
# Responsibilities:
#   - TLS termination
#   - Reverse proxy to api:5000, including PayU callbacks (section 3.1)
#   - X-Forwarded-For, so the application can trust one proxy hop (SEC-04)
#   - Static serving of uploaded branding assets off the uploads volume
#   - A rate limit backstop, independent of the application's own limiter
#
# TLS IS OFF BY DEFAULT. The HTTPS server block is commented out because the
# container ships without certificates. Drop fullchain.pem and privkey.pem into
# docker/nginx/certs, uncomment the block, and uncomment the redirect in the
# HTTP block. Until then the stack serves plain HTTP and MUST NOT be exposed to
# the internet - the JWT would travel in clear text.
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    # $remote_addr is the real client only because of the set_real_ip_from
    # block below. Note SEC-09: donor PII must not reach logs. Request paths
    # and query strings can carry identifiers, so this format deliberately
    # omits $request_body and $http_referer.
    # -------------------------------------------------------------------------
    log_format  main  '$remote_addr - $status "$request_method $uri" '
                      '$body_bytes_sent rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Matches the API's own 32kb JSON limit, with headroom for form encoding.
    client_max_body_size 64k;

    # -------------------------------------------------------------------------
    # Real client IP
    # -------------------------------------------------------------------------
    # Only the Docker bridge network is trusted to set X-Forwarded-For. This is
    # the counterpart to `app.set('trust proxy', 1)` in the application: with
    # exactly one trusted hop, a client-supplied X-Forwarded-For cannot spoof
    # the rate limit key.
    #
    # If you put a CDN or another load balancer in front of this, add its
    # ranges here AND raise the application's trust proxy hop count to match.
    # Getting this pair out of step is how rate limiting silently breaks.
    # -------------------------------------------------------------------------
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  10.0.0.0/8;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # -------------------------------------------------------------------------
    # Rate limit backstop (SEC-04)
    # -------------------------------------------------------------------------
    # This does NOT replace the application limiter - it cannot distinguish a
    # wrong password from a successful one, and it cannot count per account.
    # It is a crude ceiling that survives an application bug.
    #
    # The auth zone is intentionally tight: it is the layer that bounds the
    # SEC-02 reset-code brute force even if Phase 3 forgets the attempt
    # counter. 10r/m with burst=5 leaves a legitimate user room to fat-finger
    # an OTP while making a 10^6 code space take years.
    # -------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m    rate=60r/m;
    limit_req_status 429;
    limit_req_log_level warn;

    upstream api_upstream {
        server api:5000 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    # -------------------------------------------------------------------------
    # HTTP
    # -------------------------------------------------------------------------
    server {
        listen      80;
        server_name _;

        # Uncomment once certificates are installed.
        # location / { return 301 https://$host$request_uri; }

        # ACME HTTP-01 challenge, for certbot.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        include /etc/nginx/conf.d/kindledger-locations.conf;
    }

    # -------------------------------------------------------------------------
    # HTTPS - uncomment after installing certificates
    # -------------------------------------------------------------------------
    # server {
    #     listen      443 ssl;
    #     http2       on;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     ssl_protocols             TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache         shared:SSL:10m;
    #     ssl_session_timeout       1d;
    #     ssl_session_tickets       off;
    #     ssl_stapling              on;
    #     ssl_stapling_verify       on;
    #
    #     # 2 years, matching the frontend's Vercel header. Only send this over
    #     # TLS - on the plain HTTP block it would be ignored by browsers and
    #     # would lock out anyone without a certificate.
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #
    #     include /etc/nginx/conf.d/kindledger-locations.conf;
    # }
}
